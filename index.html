<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0a1428" />
    <meta name="description" content="Contact card for Suttipat Ritsut, Product Specialist at Forward Insight Co., Ltd." />
    <meta property="og:title" content="Suttipat Ritsut | Product Specialist" />
    <meta property="og:description" content="ERP Product Specialist | Business Process & Product Requirements" />
    <meta property="og:type" content="profile" />
    <!-- Replace og:image with a published absolute URL once the site is deployed. -->
    <title>Suttipat Ritsut | Product Specialist</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="page-shell">
      <article class="contact-card" aria-labelledby="contact-name">
        <header class="profile-header">
          <div class="profile-photo-wrap">
            <img class="profile-photo" src="assets/profile.jpg" alt="Suttipat Ritsut" />
          </div>
          <p class="eyebrow">Forward Insight Co., Ltd.</p>
          <h1 id="contact-name">Suttipat Ritsut</h1>
          <p class="nickname">FIFA</p>
          <p class="role">Product Specialist</p>
        </header>

        <section class="actions" aria-label="Contact actions">
          <a class="button button-primary" href="contact.vcf" download="Suttipat-Ritsut.vcf">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 3v11m0 0 4-4m-4 4-4-4M5 17v2a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-2" /></svg>
            Save Contact
          </a>
          <div class="secondary-actions">
            <a class="button button-secondary" href="tel:0633731240" aria-label="Call Suttipat Ritsut">
              <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M5 4h3l2 5-2 1.5a15.4 15.4 0 0 0 5.5 5.5L15 14l5 2v3c0 1.1-.9 2-2 2C10.3 21 3 13.7 3 6c0-1.1.9-2 2-2Z" /></svg>
              Call
            </a>
            <a class="button button-secondary" href="mailto:suttipat@forwardinsight" aria-label="Email Suttipat Ritsut">
              <svg aria-hidden="true" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2" /><path d="m4 7 8 6 8-6" /></svg>
              Email
            </a>
          </div>
        </section>

        <section class="details" aria-label="Contact details">
          <a href="tel:0633731240" class="detail-row"><span class="detail-label">Phone</span><span>063-373-1240</span></a>
          <a href="mailto:suttipat@forwardinsight" class="detail-row"><span class="detail-label">Email</span><span>suttipat@forwardinsight</span></a>
          <div class="detail-row"><span class="detail-label">Location</span><span>Bangkok, Thailand</span></div>
        </section>

        <section id="social-links" class="social-links" aria-label="Social links" hidden></section>

        <footer class="card-footer">
          <button class="text-button" type="button" id="share-button">
            <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="18" cy="5" r="2.5" /><circle cx="6" cy="12" r="2.5" /><circle cx="18" cy="19" r="2.5" /><path d="m8.2 10.8 7.6-4.6m-7.6 7 7.6 4.6" /></svg>
            <span>Share Contact</span>
          </button>
        </footer>
      </article>
      <p class="brand-mark">FORWARD <span>INSIGHT</span></p>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="script.js"></script>
  </body>
</html>
